<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pace Note Protractor - Rally Recce</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            rally: {
              bg: '#0b1120',
              card: '#131e32',
              border: '#1e2d4a',
              accent: '#2563eb',
              accentHover: '#1d4ed8',
              green: '#10b981',
              yellow: '#f59e0b',
              orange: '#f97316',
              red: '#ef4444'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .dial-glow {
      box-shadow: 0 0 35px rgba(37, 99, 235, 0.15), inset 0 0 25px rgba(0, 0, 0, 0.6);
    }

    .wheel-rotation {
      will-change: transform;
      transition: transform 0.05s linear;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between overflow-x-hidden bg-[#0b1120] text-slate-100 select-none">

  <header class="w-full px-4 py-3 border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md flex justify-between items-center z-10 shrink-0">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-gauge-high text-blue-500 text-xl"></i>
      <h1 class="font-bold tracking-wider uppercase text-sm sm:text-base text-slate-200">
        Pace Note Protractor
      </h1>
    </div>

    <div class="flex items-center space-x-2">
      <button id="systemToggleBtn" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-slate-800 border border-slate-700 hover:border-slate-500 text-blue-400 transition-colors">
        System: <span id="systemNameLabel">1 - 6</span>
      </button>
      <button id="sensorDiagBtn" class="p-2 rounded-lg bg-slate-800 border border-slate-700 hover:border-slate-500 text-slate-300 transition-colors" title="Sensor Diagnostics">
        <i class="fa-solid fa-microchip"></i>
      </button>
      <button id="settingsBtn" class="p-2 rounded-lg bg-slate-800 border border-slate-700 hover:border-slate-500 text-slate-300 transition-colors" title="Settings">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <div id="diagHUD" class="hidden w-full bg-slate-900/95 border-b border-blue-500/30 px-4 py-2 text-xs font-mono text-slate-300 shrink-0 z-20">
    <div class="flex justify-between items-center mb-1">
      <span class="text-blue-400 font-bold uppercase"><i class="fa-solid fa-bug mr-1"></i>Sensor Hardware Diagnostics</span>
      <span id="diagStatus" class="text-yellow-400 font-semibold">Status: Idle</span>
    </div>
    <div class="grid grid-cols-3 gap-2 text-[11px] text-slate-400">
      <div>Acc X: <span id="diagX" class="text-white font-bold">0.00</span></div>
      <div>Acc Y: <span id="diagY" class="text-white font-bold">0.00</span></div>
      <div>Acc Z: <span id="diagZ" class="text-white font-bold">0.00</span></div>
      <div>Gamma: <span id="diagGamma" class="text-white font-bold">0.0°</span></div>
      <div>Beta: <span id="diagBeta" class="text-white font-bold">0.0°</span></div>
      <div>Source: <span id="diagSource" class="text-emerald-400 font-bold">None</span></div>
    </div>
  </div>

  <main class="flex-1 flex flex-col items-center justify-between px-4 py-6 max-w-md w-full mx-auto space-y-6">
    <div class="relative w-full aspect-square max-w-[340px] sm:max-w-[380px] flex items-center justify-center my-auto">
      <div class="absolute -top-1 z-20 w-1.5 h-6 bg-red-500 rounded-full shadow-[0_0_10px_rgba(239,68,68,0.8)]"></div>

      <div class="absolute inset-0 rounded-full border-[3px] border-slate-800 dial-glow flex items-center justify-center">
        <canvas id="ticksCanvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
      </div>

      <div id="steeringWheel" class="relative w-[85%] h-[85%] rounded-full border-4 border-slate-700/80 bg-slate-900/90 shadow-2xl flex flex-col items-center justify-center cursor-grab active:cursor-grabbing wheel-rotation touch-none">
        <div id="wheelIndicator" class="absolute top-2 w-1.5 h-5 bg-red-500 rounded-full shadow-md"></div>

        <svg class="absolute inset-0 w-full h-full pointer-events-none opacity-20" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-400"/>
          <line x1="50" y1="50" x2="10" y2="50" stroke="currentColor" stroke-width="3" class="text-slate-400"/>
          <line x1="50" y1="50" x2="90" y2="50" stroke="currentColor" stroke-width="3" class="text-slate-400"/>
          <line x1="50" y1="50" x2="50" y2="90" stroke="currentColor" stroke-width="3" class="text-slate-400"/>
        </svg>

        <div class="z-10 text-center flex flex-col items-center justify-center pointer-events-none">
          <div class="flex items-center justify-center space-x-2">
            <span id="turnDirectionIcon" class="text-3xl text-slate-500 transition-colors">
              <i class="fa-solid fa-minus"></i>
            </span>
            <span id="gradeLabel" class="text-5xl sm:text-6xl font-black tracking-wider uppercase text-emerald-400 drop-shadow-md transition-colors">
              STRAIGHT
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="w-full space-y-3 shrink-0">
      <button id="enableSensorsBtn" class="w-full py-4 px-4 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-900/40 transition-all flex items-center justify-center space-x-2 text-base">
        <i class="fa-solid fa-mobile-screen-button"></i>
        <span>Enable Motion Sensors</span>
      </button>

      <div class="grid grid-cols-2 gap-2">
        <button id="zeroCalibrateBtn" class="py-3 px-3 bg-slate-800/90 hover:bg-slate-700/90 active:bg-slate-900 border border-slate-700/80 rounded-xl font-semibold text-sm text-slate-200 flex items-center justify-center space-x-2 transition-all">
          <i class="fa-solid fa-crosshairs text-blue-400"></i>
          <span>Zero / Calibrate</span>
        </button>

        <button id="toggleAudioBtn" class="py-3 px-3 bg-slate-800/90 hover:bg-slate-700/90 active:bg-slate-900 border border-slate-700/80 rounded-xl font-semibold text-sm text-slate-200 flex items-center justify-center space-x-2 transition-all">
          <i id="audioIcon" class="fa-solid fa-volume-xmark text-slate-400"></i>
          <span id="audioStatusText">Callouts: OFF</span>
        </button>
      </div>

      <div class="flex items-center justify-end pt-1">
        <button id="viewLogsBtn" class="text-xs text-slate-400 hover:text-purple-400 transition-colors flex items-center space-x-1">
          <i class="fa-solid fa-list-check"></i>
          <span>Recce Log (<span id="logCount">0</span>)</span>
        </button>
      </div>
    </div>
  </main>

  <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto no-scrollbar">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-lg text-white flex items-center space-x-2">
          <i class="fa-solid fa-sliders text-blue-500"></i>
          <span>Pace Note Settings</span>
        </h3>
        <button id="closeSettingsBtn" class="text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <div class="space-y-2">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Pace Note System</label>
        <div class="grid grid-cols-3 gap-2">
          <button data-system="1-6" class="system-select-btn py-2 text-xs font-bold rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:border-blue-500">
            1 to 6 (UK/FIA)
          </button>
          <button data-system="6-1" class="system-select-btn py-2 text-xs font-bold rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:border-blue-500">
            6 to 1 (Jemba)
          </button>
          <button data-system="descriptive" class="system-select-btn py-2 text-xs font-bold rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:border-blue-500">
            Descriptive
          </button>
        </div>
      </div>

      <div class="space-y-2">
        <div class="flex justify-between items-center text-xs">
          <label class="font-semibold text-slate-400 uppercase tracking-wider">Gyro Smoothing Filter</label>
          <span id="smoothingValueLabel" class="text-blue-400 font-mono">Medium (0.20)</span>
        </div>
        <input type="range" id="smoothingSlider" min="0.05" max="0.5" step="0.05" value="0.20" class="w-full">
      </div>

      <div class="space-y-2 pt-2 border-t border-slate-800">
        <div class="flex items-center justify-between text-xs text-slate-300">
          <span>Invert Steering Direction</span>
          <input type="checkbox" id="invertSensorCheck" class="w-4 h-4 accent-blue-600 rounded">
        </div>
      </div>

      <button id="saveSettingsBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-md transition-colors mt-4">
        Done
      </button>
    </div>
  </div>

  <div id="logsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3 shrink-0">
        <h3 class="font-bold text-lg text-white flex items-center space-x-2">
          <i class="fa-solid fa-list-ol text-purple-400"></i>
          <span>Recce Corner Log</span>
        </h3>
        <button id="closeLogsBtn" class="text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto space-y-2 no-scrollbar pr-1" id="logListContainer">
        <p class="text-xs text-slate-500 text-center py-6">No corners logged yet. Turn the wheel on recce!</p>
      </div>

      <div class="flex space-x-2 shrink-0 pt-2 border-t border-slate-800">
        <button id="clearLogsBtn" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl text-xs transition-colors">
          Clear History
        </button>
        <button id="exportLogsBtn" class="flex-1 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-xl text-xs transition-colors">
          Copy as Text
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs font-medium shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center space-x-2">
    <i id="toastIcon" class="fa-solid fa-circle-info text-blue-400"></i>
    <span id="toastMessage">Message</span>
  </div>

  <script>
    const state = {
      rawAngle: 0,
      filteredAngle: 0,
      zeroOffset: 0,
      currentAngle: 0,

      system: '1-6',
      smoothing: 0.20,
      audioEnabled: false,
      speechRate: 1.2,
      sensorsActive: false,
      invertSensor: false,

      rawX: 0, rawY: 0, rawZ: 0, rawGamma: 0, rawBeta: 0,
      activeSensorSource: 'None',
      lastGradeCalled: null,

      cornerLogs: [],

      thresholds: {
        '1-6': [
          { name: 'STRAIGHT', maxDeg: 15, color: '#10b981', code: 'STRAIGHT', speak: 'Straight' },
          { name: '6', maxDeg: 35, color: '#34d399', code: '6', speak: '6' },
          { name: '5', maxDeg: 60, color: '#facc15', code: '5', speak: '5' },
          { name: '4', maxDeg: 95, color: '#fbbf24', code: '4', speak: '4' },
          { name: '3', maxDeg: 130, color: '#fb923c', code: '3', speak: '3' },
          { name: '2', maxDeg: 165, color: '#f87171', code: '2', speak: '2' },
          { name: '1', maxDeg: 999, color: '#ef4444', code: '1', speak: '1' }
        ],
        '6-1': [
          { name: 'STRAIGHT', maxDeg: 15, color: '#10b981', code: 'STRAIGHT', speak: 'Straight' },
          { name: '1', maxDeg: 35, color: '#ef4444', code: '1', speak: '1' },
          { name: '2', maxDeg: 60, color: '#f87171', code: '2', speak: '2' },
          { name: '3', maxDeg: 95, color: '#fb923c', code: '3', speak: '3' },
          { name: '4', maxDeg: 130, color: '#fbbf24', code: '4', speak: '4' },
          { name: '5', maxDeg: 165, color: '#facc15', code: '5', speak: '5' },
          { name: '6', maxDeg: 999, color: '#34d399', code: '6', speak: '6' }
        ],
        descriptive: [
          { name: 'STRAIGHT', maxDeg: 15, color: '#10b981', code: 'STRAIGHT', speak: 'Straight' },
          { name: 'GENTLE', maxDeg: 35, color: '#34d399', code: 'GENTLE', speak: 'Gentle' },
          { name: 'FLOWING', maxDeg: 60, color: '#facc15', code: 'FLOWING', speak: 'Flowing' },
          { name: 'FAST', maxDeg: 95, color: '#fbbf24', code: 'FAST', speak: 'Fast' },
          { name: 'TIGHT', maxDeg: 130, color: '#fb923c', code: 'TIGHT', speak: 'Tight' },
          { name: 'VERY TIGHT', maxDeg: 165, color: '#f87171', code: 'VERY TIGHT', speak: 'Very Tight' },
          { name: 'HAIRPIN', maxDeg: 999, color: '#ef4444', code: 'HAIRPIN', speak: 'Hairpin' }
        ]
      }
    };

    const elements = {
      turnDirectionIcon: document.getElementById('turnDirectionIcon'),
      gradeLabel: document.getElementById('gradeLabel'),
      steeringWheel: document.getElementById('steeringWheel'),
      systemNameLabel: document.getElementById('systemNameLabel'),
      settingsModal: document.getElementById('settingsModal'),
      logsModal: document.getElementById('logsModal'),
      diagHUD: document.getElementById('diagHUD'),
      enableSensorsBtn: document.getElementById('enableSensorsBtn'),
      logCount: document.getElementById('logCount'),
      logListContainer: document.getElementById('logListContainer'),
      toast: document.getElementById('toast'),
      toastMessage: document.getElementById('toastMessage')
    };

    const synth = window.speechSynthesis;

    function initTicks() {
      const canvas = document.getElementById('ticksCanvas');
      const ctx = canvas.getContext('2d');
      const size = 300;
      canvas.width = size;
      canvas.height = size;
      const center = size / 2;
      const radius = center - 12;

      ctx.clearRect(0, 0, size, size);
      ctx.strokeStyle = '#334155';
      ctx.fillStyle = '#64748b';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let a = -180; a < 180; a += 15) {
        const rad = (a - 90) * (Math.PI / 180);
        const isMajor = a % 45 === 0;
        const tickLen = isMajor ? 10 : 5;

        const x1 = center + Math.cos(rad) * radius;
        const y1 = center + Math.sin(rad) * radius;
        const x2 = center + Math.cos(rad) * (radius - tickLen);
        const y2 = center + Math.sin(rad) * (radius - tickLen);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = isMajor ? 2 : 1;
        ctx.stroke();

        if (isMajor && a !== -180) {
          const tx = center + Math.cos(rad) * (radius - 18);
          const ty = center + Math.sin(rad) * (radius - 18);
          ctx.fillText(`${Math.abs(a)}°`, tx, ty);
        }
      }
    }

    function showToast(msg) {
      elements.toastMessage.innerText = msg;
      elements.toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => elements.toast.classList.add('opacity-0', 'pointer-events-none'), 2500);
    }

    function processAngle(targetAngle) {
      state.rawAngle = state.invertSensor ? -targetAngle : targetAngle;
      state.filteredAngle = state.filteredAngle + state.smoothing * (state.rawAngle - state.filteredAngle);
      
      let calcAngle = Math.round(state.filteredAngle - state.zeroOffset);
      if (calcAngle > 180) calcAngle -= 360;
      if (calcAngle < -180) calcAngle += 360;

      state.currentAngle = calcAngle;
      updateUI();
    }

    function updateUI() {
      const angle = state.currentAngle;
      const absAngle = Math.abs(angle);
      const isRight = angle > 2;
      const isLeft = angle < -2;
      const dirPrefix = isRight ? 'R' : isLeft ? 'L' : '';

      elements.steeringWheel.style.transform = `rotate(${angle}deg)`;

      if (isRight) {
        elements.turnDirectionIcon.className = 'text-3xl text-blue-400 transition-colors';
        elements.turnDirectionIcon.innerHTML = '<i class="fa-solid fa-arrow-right"></i>';
      } else if (isLeft) {
        elements.turnDirectionIcon.className = 'text-3xl text-blue-400 transition-colors';
        elements.turnDirectionIcon.innerHTML = '<i class="fa-solid fa-arrow-left"></i>';
      } else {
        elements.turnDirectionIcon.className = 'text-3xl text-slate-500 transition-colors';
        elements.turnDirectionIcon.innerHTML = '<i class="fa-solid fa-minus"></i>';
      }

      const activeList = state.thresholds[state.system];
      let matchedGrade = activeList[activeList.length - 1];

      for (let i = 0; i < activeList.length; i++) {
        if (absAngle <= activeList[i].maxDeg) {
          matchedGrade = activeList[i];
          break;
        }
      }

      const cleanGradeDisplay = matchedGrade.code === 'STRAIGHT' ? 'STRAIGHT' : `${dirPrefix}${matchedGrade.code}`;
      elements.gradeLabel.innerText = cleanGradeDisplay;
      elements.gradeLabel.style.color = matchedGrade.color;

      if (state.audioEnabled && cleanGradeDisplay !== 'STRAIGHT' && state.lastGradeCalled !== cleanGradeDisplay) {
        const spokenDir = isRight ? 'Right' : 'Left';
        speakCall(`${spokenDir} ${matchedGrade.speak}`);
        state.lastGradeCalled = cleanGradeDisplay;
        logCorner(spokenDir.toUpperCase(), matchedGrade.code, absAngle);
      } else if (cleanGradeDisplay === 'STRAIGHT') {
        state.lastGradeCalled = null;
      }
    }

    function speakCall(text) {
      if (!synth) return;
      synth.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = state.speechRate;
      synth.speak(utter);
    }

    function logCorner(dir, grade, deg) {
      const item = { time: new Date().toLocaleTimeString(), dir, grade, deg };
      state.cornerLogs.unshift(item);
      elements.logCount.innerText = state.cornerLogs.length;
      renderLogs();
    }

    function renderLogs() {
      if (state.cornerLogs.length === 0) {
        elements.logListContainer.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">No corners logged yet. Turn the wheel on recce!</p>`;
        return;
      }
      elements.logListContainer.innerHTML = state.cornerLogs.map(l => `
        <div class="flex items-center justify-between bg-slate-800/80 p-2.5 rounded-xl border border-slate-700/60 text-xs">
          <span class="font-mono text-slate-400">${l.time}</span>
          <span class="font-bold text-white">${l.dir} ${l.grade}</span>
          <span class="font-mono text-blue-400">${l.deg}°</span>
        </div>
      `).join('');
    }

    function enableSensors() {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission().then(res => {
          if (res === 'granted') attachSensorListeners();
          else showToast('Sensor permission denied.');
        }).catch(console.error);
      } else {
        attachSensorListeners();
      }
    }

    function attachSensorListeners() {
      window.addEventListener('devicemotion', (evt) => {
        state.activeSensorSource = 'DeviceMotion';
        document.getElementById('diagSource').innerText = 'Gravity Vector (Compensated)';
        const acc = evt.accelerationIncludingGravity;
        if (acc) {
          state.rawX = -(acc.x || 0); 
          state.rawY = acc.y || 0;
          state.rawZ = acc.z || 0;

          document.getElementById('diagX').innerText = state.rawX.toFixed(2);
          document.getElementById('diagY').innerText = state.rawY.toFixed(2);
          document.getElementById('diagZ').innerText = state.rawZ.toFixed(2);

          const projectedY = Math.sqrt(state.rawY * state.rawY + state.rawZ * state.rawZ);
          let angle = Math.atan2(state.rawX, projectedY) * (180 / Math.PI);
          processAngle(angle);
        }
      });

      window.addEventListener('deviceorientation', (evt) => {
        state.rawGamma = evt.gamma || 0;
        state.rawBeta = evt.beta || 0;
        document.getElementById('diagGamma').innerText = state.rawGamma.toFixed(1) + '°';
        document.getElementById('diagBeta').innerText = state.rawBeta.toFixed(1) + '°';
      });

      state.sensorsActive = true;
      document.getElementById('diagStatus').innerText = 'Active';
      document.getElementById('diagStatus').className = 'text-emerald-400 font-semibold';
      elements.enableSensorsBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
      elements.enableSensorsBtn.querySelector('span').innerText = 'Sensors Connected';
      showToast('Motion sensors activated');
    }

    // Touch & Drag Support
    let isDragging = false;
    let startAngle = 0;

    elements.steeringWheel.addEventListener('pointerdown', (e) => {
      isDragging = true;
      const rect = elements.steeringWheel.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      startAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI) - state.currentAngle;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const rect = elements.steeringWheel.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let angle = Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI) - startAngle;
      processAngle(angle);
    });

    window.addEventListener('pointerup', () => isDragging = false);

    // Event Bindings
    elements.enableSensorsBtn.addEventListener('click', enableSensors);
    document.getElementById('zeroCalibrateBtn').addEventListener('click', () => {
      state.zeroOffset = state.filteredAngle;
      showToast('Calibrated to Zero Baseline');
    });

    document.getElementById('toggleAudioBtn').addEventListener('click', () => {
      state.audioEnabled = !state.audioEnabled;
